<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/images/logo.png">
  <title>Privacy Policy Notice | PIGEM</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="gray-bg">

  <!-- Header: Logo Only (Clicking Logo Refreshes Current Page) -->
  <header class="site-header">
    <div class="container" style="display:flex; align-items:center; height:64px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <img data-img="logo.png" src="assets/images/logo.png" alt="Logo" onclick="window.location.reload();" style="cursor:pointer; height:40px; width:auto;" title="Click logo to refresh">
      </div>
    </div>
  </header>

  <main class="auth-page" style="min-height:calc(100vh - 120px); display:flex; align-items:center; justify-content:center; padding:24px 16px;">
    <div class="card auth-card" style="text-align:center; max-width:480px; width:100%; padding:36px 24px; box-shadow:0 8px 24px rgba(0,0,0,0.08);">
      <div style="width:58px; height:58px; border-radius:50%; background:#fee2e2; color:#c8102e; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; margin:0 auto 16px;">
        !
      </div>
      <h2 style="font-size:22px; color:var(--text); margin-bottom:8px;">Policy Document Unavailable</h2>
      <p class="muted" style="font-size:14px; line-height:1.6; margin-bottom:24px;">
        The official Data Privacy Policy and Terms of Notice document is currently undergoing legal compliance review and has not yet been published.
      </p>
      <div>
        <button type="button" class="btn btn-red btn-full" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'index.html'; }">
          &larr; Return to Previous Page
        </button>
      </div>
    </div>
  </main>

  <footer style="padding:16px 20px; text-align:center; font-size:12px; color:var(--muted); border-top:1px solid var(--line); background:#fff;">
    <span>All rights reserved &copy; 2026</span>
  </footer>

  <script src="js/config.js"></script>
</body>
</html>
