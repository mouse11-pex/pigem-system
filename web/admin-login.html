<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/images/logo.png">
  <title>Admin Login | Combined Facilities Support Services</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="simple-bar">
    <div class="container" style="display:flex; align-items:center; gap:12px;">
      <img data-img="logo.png" src="assets/images/logo.png" alt="Logo" onclick="window.location.reload();" style="cursor:pointer; height:38px; width:auto;" title="Click logo to refresh page">
      <span style="font-weight:700; font-size:16px; cursor:default; user-select:none;">Combined Facilities Support Services</span>
    </div>
  </header>

  <main class="auth-page">
    <div class="card auth-card">
      <div class="center">
        <h2>Admin Login</h2>
      </div>

      <form class="mt-big" onsubmit="handleLogin(event)">
        <div>
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="Enter your email" required>
        </div>

        <div class="mt">
          <div class="row between">
            <label for="password" style="margin:0">Password</label>
            <a href="#" class="small" style="color:var(--red); font-weight:600;" onclick="openForgotModal(); return false;">Forgot Password?</a>
          </div>
          <input id="password" type="password" class="mt" placeholder="Enter your password" required>
        </div>

        <!-- Always-Working Captcha Widget -->
        <div id="login-captcha-box" class="mt"></div>

        <div class="mt-big">
          <button id="btn-login" type="submit" class="btn btn-red btn-full">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <script>window.SYSTEM = "admin";</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
